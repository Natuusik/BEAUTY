<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA Beauty — Магазин косметики</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading-catalog" style="text-align: center; padding: 40px; color: #7d6e68;">
  Загрузка каталога из базы данных...
</div>
  <!-- Шапка сайта -->
  <header class="header">
    <div class="container header-inner">
      <div class="logo">AURA <span>BEAUTY</span></div>

      <!-- Кнопка открытия корзины -->
      <button class="open-cart-btn" id="open-cart-btn" type="button">
        <span>🛍️ Корзина</span>
        <span class="cart-badge" id="header-count">0</span>
        <span class="cart-header-sum" id="header-total">0 ₽</span>
      </button>
    </div>
  </header>

  <!-- Основной каталог -->
  <main class="container main-content">
    <h1>Уход и макияж</h1>
    <p class="subtitle">Промокод BEAUTY15: скидка 15%!</p>

    <div class="products-grid" id="products-grid">
      <!-- Карточки товаров рендерятся из script.js -->
    </div>
  </main>

  <!-- Затемнение фона при открытой корзине -->
  <div class="cart-overlay" id="cart-overlay"></div>

  <!-- Выдвижная панель корзины -->
  <aside class="cart-drawer" id="cart-drawer" aria-hidden="true">
    <div class="cart-drawer-header">
      <h2>Ваш заказ (<span id="drawer-count">0</span>)</h2>
      <button class="close-cart-btn" id="close-cart-btn" type="button" title="Закрыть">✕</button>
    </div>

    <!-- Список товаров в корзине -->
    <div class="cart-items" id="cart-items">
      <p class="empty-cart">Корзина пока пуста</p>
    </div>

    <!-- Подвал корзины с промокодом и расчетами -->
    <div class="cart-drawer-footer">
      <div class="promo-box">
        <input type="text" id="promo-input" placeholder="Промокод (например, BEAUTY15)">
        <button id="apply-promo-btn" type="button">OK</button>
      </div>
      <p id="promo-message" class="promo-message"></p>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Сумма товаров:</span>
          <span id="subtotal-price">0 ₽</span>
        </div>
        <div class="summary-row discount-row" id="discount-row" style="display: none;">
          <span>Скидка:</span>
          <span id="discount-amount">−0 ₽</span>
        </div>
        <div class="summary-row">
          <span>Доставка:</span>
          <span id="delivery-price">0 ₽</span>
        </div>
        <div class="summary-total">
          <span>Итого:</span>
          <span id="final-price">0 ₽</span>
        </div>
        <p class="free-delivery-hint" id="delivery-hint">
          Бесплатная доставка при заказе от 3 500 ₽
        </p>

        <div class="cart-actions-bottom">
          <button id="clear-cart-btn" class="btn-clear" type="button" style="display: none;">Очистить корзину</button>
          <button id="checkout-btn" class="btn-checkout" type="button" disabled>Оформить заказ</button>
        </div>
      </div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
